<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Semantic Playback · Phone</title>
  <style>
    :root { --bg: #0b0e14; --card: #141a26; --line: #243049; --text: #e6ebf5; --muted: #8b97ad; --accent: #ff9900; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { padding: 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    header b { font-size: 17px; }
    #status { font-size: 12px; color: var(--muted); }
    main { padding: 12px 16px 40px; max-width: 640px; margin: 0 auto; }
    .empty { color: var(--muted); text-align: center; margin-top: 40px; }
    .clip { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 14px; overflow: hidden; }
    .clip.hl { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255,153,0,.35); }
    .clip video { width: 100%; display: block; background: #000; }
    .clip .meta { padding: 10px 12px; }
    .clip h3 { margin: 0 0 2px; font-size: 16px; }
    .clip .sub { color: var(--muted); font-size: 12px; }
    .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .actions a, .actions button { flex: 1; text-align: center; padding: 9px; border-radius: 10px; border: 1px solid var(--line); background: #1b2333; color: var(--text); text-decoration: none; font: inherit; }
    .actions .primary { background: var(--accent); color: #111; border: 0; font-weight: 700; }
  </style>
</head>
<body>
  <header><b>📱 Sent from your TV</b><span id="status">connecting…</span></header>
  <main id="list"><p class="empty" id="empty">Clips you send from the TV (“clip that and send it to my phone”) appear here instantly.</p></main>
  <script type="module">
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    const fmt = (ms) => { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
    const seen = new Set();
    const want = () => new URLSearchParams(location.hash.slice(1)).get("clip");
    function add(share) {
      if (seen.has(share.shareId)) return;
      seen.add(share.shareId);
      document.getElementById("empty")?.remove();
      const c = share.clip;
      const el = document.createElement("article");
      el.className = "clip";
      el.id = c.clipId;
      el.innerHTML = `<video src="${esc(c.url)}" poster="${esc(c.thumbnailUrl)}" controls playsinline preload="metadata"></video>
        <div class="meta"><h3>${esc(c.label)}</h3><div class="sub">${esc(c.attribution)} · ${fmt(c.endMs - c.startMs)} · ${new Date(share.createdAt).toLocaleTimeString()}</div>
        <div class="actions"><a class="primary" href="${esc(c.watchFullUrl)}">Watch full match</a>
        <button data-share>Share…</button><a href="${esc(c.url)}" download>Save</a></div></div>`;
      el.querySelector("[data-share]").addEventListener("click", () =>
        navigator.share ? navigator.share({ title: c.label, text: c.attribution, url: c.url }).catch(() => {}) : navigator.clipboard?.writeText(c.url));
      document.getElementById("list").prepend(el);
      if (want() === c.clipId) { el.classList.add("hl"); el.scrollIntoView({ behavior: "smooth" }); }
      if (navigator.vibrate) navigator.vibrate(80);
    }
    function connect() {
      const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
      ws.onopen = () => { ws.send(JSON.stringify({ type: "hello", role: "companion", deviceId: `phone-${Math.random().toString(36).slice(2, 7)}` })); document.getElementById("status").textContent = "live"; };
      ws.onclose = () => { document.getElementById("status").textContent = "reconnecting…"; setTimeout(connect, 1500); };
      ws.onmessage = (e) => { const m = JSON.parse(e.data); if (m.type === "share") add(m.share); };
    }
    connect();
  </script>
</body>
</html>
